name: Docker Front/back Build & Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: cd-main
  cancel-in-progress: true

jobs:

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build backend Docker image
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./back
          file: back/Dockerfile
          push: false  # Ne pas pousser encore
          tags: backend:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build frontend Docker image
        uses: docker/build-push-action@v6.9.0
        with:
          context: front
          file: front/Dockerfile
          push: false
          tags: frontend:${{ github.sha }}
  push-to-dockerhub:
    needs: [build-backend, build-frontend] 
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Push uniquement sur merge vers main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push backend image
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./back
          file: back/Dockerfile
          push: true
          tags: |
            yoricklio/bobapp-back:${{ github.sha }}
            yoricklio/bobapp-back:main
            
      - name: Push frontend image
        uses: docker/build-push-action@v6.9.0
        with:
          context: front
          file: front/Dockerfile
          push: true
          tags: |
            yoricklio/bobapp-front:${{ github.sha }}
            yoricklio/bobapp-front:main
